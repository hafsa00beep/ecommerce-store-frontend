<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر إلكتروني - E-Commerce Store</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f9; text-align: center; }
        header { background: #1e293b; color: white; padding: 20px; border-radius: 8px; }
        .products { display: flex; justify-content: center; gap: 20px; margin-top: 30px; flex-wrap: wrap; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 200px; }
        button { background: #2563eb; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <header>
        <h1>متجر الأجهزة والمنتجات الرقمية</h1>
        <p>واجهة متجر إلكتروني متجاوبة وعصرية</p>
    </header>
    <div class="products">
        <div class="card">
            <h3>منتج رقمي 1</h3>
            <p>سعر الميزانية: 150 ج.م</p>
            <button>أضف للسلة</button>
        </div>
        <div class="card">
            <h3>منتج رقمي 2</h3>
            <p>سعر الميزانية: 300 ج.م</p>
            <button>أضف للسلة</button>
        </div>
    </div>
</body>
</html>
